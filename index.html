<!DOCTYPE html>
<html>
<head>
    <title>The Finale: Hybrid OBS Clock</title>
    <style>
        body {
            background: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .clock {
            width: 350px;
            height: 350px;
            border: 5px solid #00ffff;
            border-radius: 50%;
            position: relative;
            color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        /* Digital Display Positioned in the Upper Middle */
        .digital-time {
            position: absolute;
            width: 100%;
            top: 65%; /* Positioned below the center pin */
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
            z-index: 1;
        }

        .clock::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: #00ffff;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            box-shadow: 0 0 10px #00ffff;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 10px;
            background: rgba(0, 255, 255, 0.4);
            left: 50%;
            transform-origin: 0 175px;
        }

        .tick.hour-tick {
            width: 4px;
            height: 15px;
            background: #00ffff;
        }

        .number {
            position: absolute;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            font-size: 1.4rem;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 8px #00ffff;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            background: #00ffff;
            border-radius: 4px;
            z-index: 5;
        }

        .hour { width: 8px; height: 85px; margin-left: -4px; box-shadow: 0 0 10px #00ffff; }
        .minute { width: 5px; height: 125px; margin-left: -2.5px; box-shadow: 0 0 10px #00ffff; }
        .second { width: 2px; height: 145px; background: #ff0055; margin-left: -1px; box-shadow: 0 0 12px #ff0055; }
    </style>
</head>
<body>

    <div class="clock" id="clock">
        <div class="digital-time" id="digital">00:00:00</div>
        <div id="hour" class="hand hour"></div>
        <div id="minute" class="hand minute"></div>
        <div id="second" class="hand second"></div>
    </div>

    <script>
        const clock = document.getElementById('clock');
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');
        const digitalDisplay = document.getElementById('digital');

        // Create Ticks
        for (let i = 0; i < 60; i++) {
            const tick = document.createElement('div');
            tick.className = 'tick';
            if (i % 5 === 0) tick.classList.add('hour-tick');
            tick.style.transform = `translateX(-50%) rotate(${i * 6}deg)`;
            clock.appendChild(tick);
        }

        // Create Numbers
        for (let i = 1; i <= 12; i++) {
            const num = document.createElement('div');
            num.className = 'number';
            const angle = (i * 30) * (Math.PI / 180);
            const radius = 135;
            const x = 175 + radius * Math.sin(angle);
            const y = 175 - radius * Math.cos(angle);
            num.style.left = `${x}px`;
            num.style.top = `${y}px`;
            num.innerText = i;
            clock.appendChild(num);
        }

        function updateClock() {
            const now = new Date();
            const ms = now.getMilliseconds();
            const s = now.getSeconds();
            const m = now.getMinutes();
            const h = now.getHours();

            // Analog Sweep
            const sDeg = ((s + ms / 1000) / 60) * 360;
            const mDeg = ((m + s / 60) / 60) * 360;
            const hDeg = ((h % 12 + m / 60) / 12) * 360;

            secondHand.style.transform = `rotate(${sDeg}deg)`;
            minuteHand.style.transform = `rotate(${mDeg}deg)`;
            hourHand.style.transform = `rotate(${hDeg}deg)`;

            // Digital Finale
            const displayH = h.toString().padStart(2, '0');
            const displayM = m.toString().padStart(2, '0');
            const displayS = s.toString().padStart(2, '0');
            digitalDisplay.innerText = `${displayH}:${displayM}:${displayS}`;

            requestAnimationFrame(updateClock);
        }

        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
